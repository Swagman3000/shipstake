[package]
name = "shipstake"
version = "0.1.0"
description = "Lock SOL behind a public promise to ship"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "shipstake"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
devnet-fast = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
solana-security-txt = "1.1.2"



[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
